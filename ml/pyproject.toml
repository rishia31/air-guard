[project]
name = "airmate-ml"
version = "0.1.0"
description = "Airmate asthma risk model: PyTorch temporal survival model, Captum explanations, simulated cohort"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "torch>=2.3",
  "captum>=0.7",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Night-time cough detector (Audio Spectrogram Transformer fine-tuned on AudioSet).
cough = ["transformers>=4.44"]

[project.scripts]
airmate-train = "airmate_ml.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airmate_ml"]
