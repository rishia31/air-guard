[project]
name = "airmate-api"
version = "0.1.0"
description = "Airmate backend: FastAPI ingest, risk scoring, Grok voice agent relay, community and doctor reports"
requires-python = ">=3.10"
dependencies = [
  "airmate-ml",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "websockets>=12.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
# Supabase / any hosted Postgres: set DATABASE_URL=postgresql+psycopg://...
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
airmate-api = "airmate_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airmate_api"]
